<style>
/* Same structure and type as Benjamin's pricing page; same palette as the Eratosthenes homepage. */
:root{
  --bg:#f7f4ee; --bg-alt:#eeeae1; --surface:#fffdf9; --border:#dcd5c7;
  --text:#1e2a31; --muted:#5e6a71; --slate:#6e7a82;
  --accent:#ba5757; --accent-dark:#9c4343;
  --red-soft:#f3dcd9; --slate-soft:#dfe5e8;
  --shadow:0 8px 24px -12px rgba(30,42,49,.28);
  --radius:16px;
  --font-serif:"Cutive Mono",monospace;
  --font-sans:"Cutive Mono",monospace;
  --font-prose:"Lora",Georgia,"Times New Roman",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);font-weight:700;background:var(--bg);color:var(--text);
     line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;
     font-family:var(--font-sans);font-weight:600;text-decoration:none;border-radius:999px;cursor:pointer;
     border:1px solid transparent;transition:transform .15s,box-shadow .15s,background-color .15s,color .15s;white-space:nowrap}
.btn--primary{background:var(--red-soft);color:var(--accent-dark)}
.btn--primary:hover{background:var(--slate-soft);color:var(--text);transform:translateY(-1px)}
.btn--ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn--ghost:hover{border-color:var(--text);transform:translateY(-1px)}
.btn--lg{padding:.85rem 1.7rem;font-size:1rem}
.btn--sm{padding:.5rem 1.1rem;font-size:.85rem}
.btn--block{width:100%}

/* ── Nav ─────────────────────────────────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:100;background:rgba(247,244,238,.72);
     backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
.nav--scrolled{border-bottom-color:var(--border);box-shadow:0 4px 20px -16px rgba(30,42,49,.45)}
.nav__inner{max-width:1100px;margin:0 auto;padding:1rem 1.5rem;
            display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
.nav__links{display:flex;align-items:center;gap:1.75rem;font-size:.95rem;font-weight:700}
.nav__links a{color:var(--accent-dark);transition:color .2s}
.nav__links a:hover,.nav__links a.active{color:var(--text)}
.nav__toggle{display:none;flex-direction:column;justify-content:center;gap:5px;
             width:36px;height:36px;background:transparent;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.nav__toggle span{display:block;height:2px;width:18px;margin:0 auto;background:var(--text);transition:transform .2s,opacity .2s}

/* ── Logo lockup: the mark and the name ("Eratost" in the logo's shadow) ─── */
.lockup{display:inline-flex;align-items:center;gap:.45em;font-family:"Cutive Mono",monospace;
        font-weight:700;line-height:1;white-space:nowrap}
.lockup .era-mark{width:1.75em;height:1.75em;flex:0 0 auto}
.lockup .era-a{color:#1e2a31}
.lockup .era-b{color:#d1d1d1}
.lockup--nav{font-size:1.55rem}
.lockup--footer{font-size:1.25rem}

/* ── Scroll-reveal ───────────────────────────────────────────────────────── */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease-out,transform .7s ease-out}
.reveal.in-view{opacity:1;transform:translateY(0)}

/* ── Shared section ──────────────────────────────────────────────────────── */
section{padding:5rem 1.5rem;max-width:1100px;margin:0 auto;scroll-margin-top:76px}
.section-title{font-family:var(--font-serif);font-size:clamp(1.7rem,4vw,2.4rem);text-align:center;margin-bottom:.75rem}
.section-sub{text-align:center;color:var(--muted);max-width:650px;margin:0 auto 3rem;font-size:1rem}

/* ── Pricing header ──────────────────────────────────────────────────────── */
.pricing-hero{padding:4.5rem 1.5rem 1rem;text-align:center}
.pricing-hero .section-sub{margin-bottom:1.5rem}
.billing-toggle{display:inline-flex;align-items:center;gap:.25rem;margin:.5rem auto 0;
                background:var(--bg-alt);border:1px solid var(--border);border-radius:999px;padding:.28rem}
.billing-toggle button{font-family:var(--font-sans);font-weight:700;font-size:.9rem;border:0;background:transparent;
                       color:var(--muted);cursor:pointer;border-radius:999px;padding:.5rem 1.2rem;transition:background .2s,color .2s}
.billing-toggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.billing-toggle .save-hint{font-size:.72rem;font-weight:700;color:var(--accent-dark);margin-left:.35rem}

/* ── Plan cards ──────────────────────────────────────────────────────────── */
.plans{padding-top:2rem;padding-bottom:1.5rem;max-width:1260px}
.plans__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.25rem;max-width:1200px;margin:0 auto}
.plan-card{position:relative;display:flex;flex-direction:column;gap:1.1rem;background:var(--surface);
           border:1px solid var(--border);border-radius:var(--radius);padding:2rem 1.75rem;transition:transform .2s,box-shadow .2s}
.plan-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.plan-card--pro{border-color:var(--accent);box-shadow:0 0 0 2px rgba(186,87,87,.14),var(--shadow)}
.plan-badge{position:absolute;top:-.8rem;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:700;
            letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:999px;
            padding:.28rem .85rem;white-space:nowrap}
.plan-name{font-family:var(--font-serif);font-size:1.25rem}
.plan-for{font-size:.85rem;color:var(--muted);margin-top:-.7rem}
.plan-price{display:flex;align-items:baseline;gap:.3rem;flex-wrap:wrap}
.plan-price .amount{font-family:var(--font-serif);font-size:2.6rem;line-height:1;color:var(--text)}
.plan-price .unit{font-size:.95rem;color:var(--muted);font-weight:700}
.plan-sub{font-size:.85rem;color:var(--muted);min-height:1.2em}
.plan-save{display:inline-block;font-size:.75rem;font-weight:700;color:var(--accent-dark);background:var(--red-soft);
           border-radius:999px;padding:.2rem .6rem;width:max-content}
.plan-save:empty{display:none}
.plan-feats{list-style:none;display:flex;flex-direction:column;gap:.6rem;font-size:.9rem;font-weight:400;
            font-family:var(--font-prose);color:var(--text)}
.plan-feats li{display:flex;align-items:flex-start;gap:.55rem}
.plan-feats .tick{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:1.25rem;height:1.25rem;
                  border-radius:50%;background:var(--slate-soft);color:var(--text);font-size:.72rem;margin-top:.12em}
.plan-feats li.soon{color:var(--muted)}
.plan-feats li.soon .tick{background:var(--bg-alt);color:var(--muted)}
.plan-feats b{font-weight:600}
.soon-pill{align-self:center;font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
           border:1px dashed var(--border);border-radius:999px;padding:.08rem .45rem;white-space:nowrap;font-family:var(--font-sans)}
.plan-card .btn{margin-top:auto}
.plan-fineprint{font-size:.75rem;color:var(--muted);text-align:center;max-width:760px;margin:1.5rem auto 0}
.plan-fineprint a{text-decoration:underline}

/* ── Labs & institutions ─────────────────────────────────────────────────── */
.enterprise{max-width:1040px;padding-top:1rem}
.enterprise__inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.5rem;
                   background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem 2.25rem}
.enterprise__text{flex:1 1 340px}
.enterprise__text h2{font-family:var(--font-serif);font-size:1.35rem;margin-bottom:.5rem}
.enterprise__text p{color:var(--muted);font-size:.95rem;font-weight:400;font-family:var(--font-prose)}

/* ── Features ────────────────────────────────────────────────────────────── */
.features__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem;margin-top:1rem}
.feature-card{position:relative;border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;
              background:var(--surface);transition:transform .2s,box-shadow .2s}
.feature-card--pro{border-color:var(--accent)}
.feature-card--soon{border-style:dashed}
.feat-badge{position:absolute;top:1.1rem;right:1.1rem;font-size:.6rem;font-weight:700;letter-spacing:.06em;
            text-transform:uppercase;color:#fff;background:var(--accent);border-radius:999px;padding:.16rem .5rem}
.feat-badge--soon{color:var(--muted);background:var(--bg-alt);border:1px dashed var(--border)}
.feature-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.feature-card h3{font-family:var(--font-serif);font-size:1.1rem;margin-bottom:.5rem}
.feature-card .feat-badge ~ h3{padding-right:3.5rem}
.feature-card p{color:var(--muted);font-size:.95rem;font-weight:400;font-family:var(--font-prose)}
@media(min-width:900px){.features__grid{grid-template-columns:repeat(4,1fr)}}

/* ── FAQ ─────────────────────────────────────────────────────────────────── */
.faq{max-width:760px}
.faq__item{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:1.1rem 1.35rem;margin-bottom:1rem}
.faq__item summary{cursor:pointer;font-weight:700;font-size:1rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.faq__item summary::-webkit-details-marker{display:none}
.faq__item summary::after{content:"+";color:var(--accent);font-size:1.3rem;transition:transform .2s}
.faq__item[open] summary::after{transform:rotate(45deg)}
.faq__item p{margin-top:.85rem;color:var(--muted);font-size:.95rem;font-weight:400;font-family:var(--font-prose)}
.faq__item a{color:var(--accent-dark);text-decoration:underline}

/* ── CTA ─────────────────────────────────────────────────────────────────── */
.cta__inner{text-align:center;background:var(--red-soft);transition:background .35s ease;border-radius:24px;padding:3.5rem 2rem;color:var(--text)}
.cta__inner h2{font-family:var(--font-serif);font-size:clamp(1.5rem,3.5vw,2.1rem);margin-bottom:.5rem}
.cta__inner p{opacity:.8;margin-bottom:1.75rem}
.cta__inner:hover{background:var(--slate-soft)}
.cta__inner .btn--primary{background:transparent;color:var(--accent-dark);border:2px solid var(--accent-dark)}
.cta__inner:hover .btn--primary{color:var(--text);border-color:var(--text)}

/* ── Footer ──────────────────────────────────────────────────────────────── */
.footer{border-top:1px solid var(--border);padding:2rem 1.5rem}
.footer__inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
.footer__copy{color:var(--muted);font-size:.9rem}
.footer__copy a:hover{color:var(--accent-dark)}

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media(max-width:760px){
  .nav__links{position:absolute;top:100%;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);
              flex-direction:column;align-items:stretch;gap:1rem;padding:1.25rem 1.5rem;display:none}
  .nav--open .nav__links{display:flex}
  .nav__links a{text-align:center}
  .nav__toggle{display:flex}
  .nav--open .nav__toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav--open .nav__toggle span:nth-child(2){opacity:0}
  .nav--open .nav__toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  section{padding:3.5rem 1rem}
  .pricing-hero{padding:3rem 1rem 1rem}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{transition:none!important;opacity:1!important;transform:none!important}
}

/* ── Report page ─────────────────────────────────────────────────────────── */
.rp{max-width:1080px;margin:0 auto;padding:2.6rem 1.5rem 3rem}
.rp .kicker{font-family:var(--font-sans);color:var(--accent-dark);letter-spacing:.04em;font-size:.85rem;text-transform:uppercase}
.rp h1{font-family:var(--font-serif);font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.2;margin:.35rem 0 .6rem}
.rp .meta{font-family:var(--font-prose);font-weight:400;color:var(--muted)}
.rp .meta a{text-decoration:underline}
.rp .intro{font-family:var(--font-prose);font-weight:400;font-size:1.05rem;line-height:1.7;margin:1.4rem 0 0;max-width:820px}
.rp h2{font-family:var(--font-serif);font-size:1.4rem;margin:2.6rem 0 .4rem}
.rp .sub{font-family:var(--font-prose);font-weight:400;color:var(--muted);margin-bottom:1rem;max-width:820px;line-height:1.6}
.rp .grp{font-family:var(--font-sans);font-size:.95rem;margin:1.4rem 0 .5rem;color:var(--slate)}
.rp .cand{display:flex;gap:.9rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem}
.rp .cand .n{flex:0 0 1.9rem;height:1.9rem;border-radius:50%;background:#f2c94c;color:#5a3d00;border:1px solid #9c6b00;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-sans)}
.rp .cand .t{font-family:var(--font-prose);font-weight:600;font-size:1.02rem;line-height:1.4}
.rp .cand .t a:hover{text-decoration:underline}
.rp .cand .a{font-family:var(--font-prose);font-weight:400;color:var(--muted);font-size:.9rem;margin:.15rem 0 .35rem}
.rp .cand .w{font-family:var(--font-prose);font-weight:400;line-height:1.55}
.rp .cand .near{font-family:var(--font-prose);font-weight:400;font-size:.85rem;color:var(--slate);margin-top:.35rem}
.rp .tag{display:inline-block;font-family:var(--font-sans);font-size:.72rem;border-radius:999px;padding:0 .5rem;margin-left:.35rem;background:var(--slate-soft);vertical-align:2px}
.rp .tag.hot{background:var(--red-soft);color:var(--accent-dark)}
.rp .mapbox{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem;overflow:hidden}
.rp .legend{display:flex;flex-wrap:wrap;gap:1.2rem;font-family:var(--font-prose);font-weight:400;font-size:.9rem;margin:.2rem 0 .8rem;color:var(--muted)}
.rp .legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:.35rem}
.rp .how{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.8rem;margin-top:.4rem}
.rp .how div{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.9rem 1rem;font-family:var(--font-prose);font-weight:400;line-height:1.55}
.rp .how b{font-family:var(--font-sans);display:block;margin-bottom:.2rem}
.rp .cta{margin-top:2.6rem;background:var(--red-soft);border-radius:18px;padding:2rem 1.6rem;text-align:center}
.rp .cta h2{margin:0 0 .4rem}.rp .cta p{font-family:var(--font-prose);font-weight:400;margin-bottom:1.2rem}
.rp .cta .row{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.rp .cta .btn--primary{background:var(--text);color:#fff}.rp .cta .btn--primary:hover{background:var(--accent-dark);color:#fff}
.rp .fine{font-family:var(--font-prose);font-weight:400;font-size:.85rem;color:var(--muted);margin-top:2rem;line-height:1.6}
.rp .state{text-align:center;padding:4rem 1rem;font-family:var(--font-prose);font-weight:400;color:var(--muted)}
.rp .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2.2rem;align-items:start}
.rp .top>*,.rp .cand>div{min-width:0}
.rp{overflow-wrap:anywhere}
.rp .tmap{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:.6rem;box-shadow:var(--shadow)}
.rp .tmap svg{display:block;width:100%;height:auto}
.rp .tmap .cap{font-family:var(--font-prose);font-weight:400;font-size:.82rem;color:var(--muted);margin:.45rem .3rem .1rem;line-height:1.45}
.rp .tmap .mk{cursor:pointer}
.rp .cand:target{box-shadow:0 0 0 2px #f2c94c}
@media(max-width:860px){.rp .top{grid-template-columns:minmax(0,1fr)}}
</style>

<script>
(function(){
  var L = window.EratostLoader;
  if (L) document.querySelectorAll('.js-mark').forEach(function(a){ a.insertAdjacentHTML('afterbegin', L.mark()); });
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var rp = document.getElementById('rp'), state = document.getElementById('state');
  var id = new URLSearchParams(location.search).get('id') || '';
  var fmtDate = function(t){ try { return new Date(t).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }); } catch(_) { return ''; } };
  var authorsShort = function(a, n){ a = a || []; return a.slice(0, 3).join(', ') + ((n || a.length) > 3 ? ' et al.' : ''); };

  var signedIn = false;
  function openApp(e){
    if (e) e.preventDefault();
    if (signedIn) { location.href = 'search.html'; return; }
    if (window.SciCoAuth) window.SciCoAuth.signInWithGoogle().catch(function(err){ console.error(err); });
  }

  function render(d){
    var r = d.report || {}, cands = r.candidates || [];
    var groups = [['main','Closely related work'], ['preprint','Recent preprints'], ['foundational','Foundational work']];
    var n = 0, marks = [], list = '';
    groups.forEach(function(g){
      var cs = cands.filter(function(c){ return (c.group || 'main') === g[0]; });
      if (!cs.length) return;
      list += '<div class="grp">' + esc(g[1]) + '</div>';
      cs.forEach(function(c){
        n += 1; marks.push({ title: c.title, n: n });
        list += '<div class="cand" id="cand-' + n + '"><span class="n">' + n + '</span><div>' +
          '<div class="t">' + (c.link ? '<a href="' + esc(c.link) + '" target="_blank" rel="noopener">' + esc(c.title) + '</a>' : esc(c.title)) +
            (c.highly_cited ? '<span class="tag hot">highly cited</span>' : '') + (c.recent ? '<span class="tag">recent</span>' : '') + '</div>' +
          '<div class="a">' + esc(authorsShort(c.authors, c.n_authors)) + (c.venue ? ' · ' + esc(c.venue) : '') + (c.year ? ' · ' + esc(c.year) : '') + '</div>' +
          (c.why ? '<div class="w">' + esc(c.why) + '</div>' : '') +
          (c.near && c.near.opening ? '<div class="near">Close to your paragraph' + (c.near.section ? ' in ' + esc(c.near.section) : '') + ': "' + esc(c.near.opening) + '…"</div>' : '') +
        '</div></div>';
      });
    });
    var nMap = d.graph && d.graph.papers ? d.graph.papers.length : 0;
    var tm = d.topic_map && d.topic_map.points && d.topic_map.points.length ? d.topic_map : null;
    rp.innerHTML =
      '<div class="top"><div>' +
      '<div class="kicker">Eratost literature report</div>' +
      '<h1>' + esc(r.title) + '</h1>' +
      '<div class="meta">' + esc(authorsShort(r.authors)) + ' · <a href="https://arxiv.org/abs/' + esc(r.arxiv_id) + '" target="_blank" rel="noopener">arXiv:' + esc(r.arxiv_id) + '</a>' +
        (r.submitted ? ' · submitted ' + esc(fmtDate(r.submitted)) : '') + '</div>' +
      '<p class="intro">We read the related-work section of this paper and ran Eratost, our literature search, on each of its ' + esc(r.n_paragraphs || '') + ' paragraphs. ' +
        'Below are <b>' + cands.length + ' papers</b> close to what those paragraphs discuss that the reference list does not include. You may know some of them and have left them out on purpose; we hope a few are useful.' +
        (nMap ? ' Further down, a 3D map shows where your paper sits among the ' + nMap + ' papers around it, and where the open gaps are.' : '') + '</p>' +
      '</div>' + (tm ? '<div class="tmap"><div id="tmap"></div><div class="cap">The topic map of the papers around yours: papers on similar subjects sit close; shading shows how crowded each area is. ' +
        '<b style="color:#ba5757">Red</b>: your paper. <b style="color:#9c6b00">Gold</b>: the suggested papers (click a number). G: open research gaps.</div></div>' : '') +
      '</div>' +
      '<h2>Related work you may find useful</h2>' +
      '<p class="sub">Each is matched to the paragraph it is closest to, with one sentence on why, written only from the two abstracts. The numbers match the gold markers on the map.</p>' +
      list +
      (nMap ?
        '<h2>Where your paper sits</h2>' +
        '<p class="sub">The research-gap map of the ' + nMap + ' papers Eratost found around your related-work section. Drag to rotate; switch to "Disconnectivity" for the same tree drawn flat.</p>' +
        '<div class="legend"><span><i style="border:2.5px solid #ba5757"></i>your paper</span><span><i style="background:#f2c94c;border:1px solid #9c6b00"></i>suggested papers (numbered)</span><span><i style="background:#f2c94c;border:2px solid #d64545"></i>G = research gap</span></div>' +
        '<div class="mapbox"><div id="dg"></div></div>' +
        '<h2>How to read the gap graph</h2>' +
        '<div class="how">' +
          '<div><b>Dots are papers</b>Your paper is ringed in red and labelled. The papers listed above are ringed in gold with their number. Hover any dot for its title and details; click to keep it highlighted.</div>' +
          '<div><b>Height is how sparse a region is</b>The vertical axis is a free energy, minus the log of how densely papers sit around that point. Well-studied topics are deep wells near the floor; thinly covered ground is high.</div>' +
          '<div><b>Posts are topics, joins are barriers</b>Each vertical post stands in a topic basin, at its most central paper. Two posts join at the lowest pass between their basins: the higher that join, the more separate the two literatures.</div>' +
          '<div><b>Gold G-nodes are research gaps</b>Found on the topic map as empty ground between two crowded topics. Hover one to see which two papers a new paper placed there would bring closest together, and how much the barrier between them would fall.</div>' +
          '<div><b>Floor and terrain</b>The floor is the topic map seen from above: papers about similar things sit close, and colour shows how crowded each area is. The translucent terrain over it is the same landscape in 3D; the opacity slider makes it lighter.</div>' +
          '<div><b>What it covers</b>The map is built from the papers Eratost found around your related-work section, not the whole field. Positions come from title embeddings, so read neighbourhoods, not exact distances.</div>' +
        '</div>' : '') +
      '<div class="cta"><h2>Find the gaps around your next idea</h2><p>Describe an idea and Eratost finds the prior work and maps where the field is still open. Search and topic maps are free.</p>' +
        '<div class="row"><button class="btn btn--primary btn--lg js-open">Try Eratost free</button><button class="btn btn--ghost btn--lg js-wait">Join the early-access list</button></div></div>' +
      '<p class="fine">This page is private to people with its link and is removed on ' + esc(fmtDate(d.expires_at)) + '. ' +
        'Made by Eratost, part of SciCoagent, from public arXiv and OpenAlex data. If you would rather not hear from us, reply to the email or write to <a href="mailto:contact@scicoagent.com" style="text-decoration:underline">contact@scicoagent.com</a> and we will not contact you again.</p>';

    if (tm) drawTopicMap(document.getElementById('tmap'), tm, r.title, marks);
    rp.querySelectorAll('.js-open').forEach(function(b){ b.addEventListener('click', openApp); });
    rp.querySelectorAll('.js-wait').forEach(function(b){ b.addEventListener('click', function(){ window.EratostWaitlist.open({ plan: 'pro', page: 'report' }); }); });
    if (nMap) {
      var session = { disconnectivity: d.graph, disconnectivity_res: { map2d: d.graph }, topic_map: d.topic_map };
      window.dgEnsureRes = function(){ return Promise.resolve(); };
      window.renderDisconnectivity(session, document.getElementById('dg'), { admin: false, mode: '3d', focus: r.title, marks: marks });
    }
  }

  // The 2D topic map: density floor (one smooth image), contours, every paper, the gaps, the reader's
  // paper (red) and the suggested papers (gold, numbered as in the list; click to jump to it).
  function drawTopicMap(el, tm, ownTitle, marks){
    var W = 600, H = 430, key = function(t){ return String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); };
    var X = function(x){ return 8 + x * (W - 16); }, Y = function(y){ return 8 + y * (H - 16); };
    var g = tm.grid || [], G = g.length, out = '';
    var col = function(t){ t = Math.max(0, Math.min(1, t)); var A = [251,250,248], B = [132,151,176], C = [186,87,87];
      var a = t < .5 ? A : B, b = t < .5 ? B : C, f = t < .5 ? t / .5 : (t - .5) / .5; return [0,1,2].map(function(i){ return Math.round(a[i] + (b[i] - a[i]) * f); }); };
    if (G > 1) {
      var cv = document.createElement('canvas'); cv.width = G; cv.height = G;
      var cx = cv.getContext('2d'), im = cx.createImageData(G, G);
      for (var r = 0; r < G; r++) for (var c = 0; c < G; c++) {
        var v = Math.max(0, Math.min(1, +g[r][c] || 0)), k = col(v), o = (r * G + c) * 4;
        im.data[o] = k[0]; im.data[o+1] = k[1]; im.data[o+2] = k[2]; im.data[o+3] = Math.round(200 * Math.max(0, Math.min(1, (v - .02) / .08)));
      }
      cx.putImageData(im, 0, 0);
      var h = 0.5 / (G - 1);
      out += '<image href="' + cv.toDataURL() + '" x="' + X(-h) + '" y="' + Y(-h) + '" width="' + (X(1 + h) - X(-h)) + '" height="' + (Y(1 + h) - Y(-h)) + '" preserveAspectRatio="none"/>';
      var segs = '', lv = [.15,.3,.45,.6,.75,.9], s1 = 1 / (G - 1);         // contour lines (marching squares)
      for (var r2 = 0; r2 < G - 1; r2++) for (var c2 = 0; c2 < G - 1; c2++) {
        var q = [g[r2][c2], g[r2][c2+1], g[r2+1][c2+1], g[r2+1][c2]], P4 = [[c2,r2],[c2+1,r2],[c2+1,r2+1],[c2,r2+1]];
        lv.forEach(function(L){
          var ps = [];
          for (var e = 0; e < 4; e++) { var a = e, b = (e + 1) % 4;
            if ((q[a] < L) !== (q[b] < L)) { var t = (L - q[a]) / (q[b] - q[a]); ps.push([(P4[a][0] + t * (P4[b][0] - P4[a][0])) * s1, (P4[a][1] + t * (P4[b][1] - P4[a][1])) * s1]); } }
          for (var j = 0; j + 1 < ps.length; j += 2) segs += 'M' + X(ps[j][0]).toFixed(1) + ' ' + Y(ps[j][1]).toFixed(1) + 'L' + X(ps[j+1][0]).toFixed(1) + ' ' + Y(ps[j+1][1]).toFixed(1);
        });
      }
      out += '<path d="' + segs + '" fill="none" stroke="#55626a" stroke-opacity=".45" stroke-width=".7"/>';
    }
    var pts = tm.points || [], by = {};
    pts.forEach(function(p){ by[key(p.title)] = p;
      out += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="2.6" fill="#6e7a82" fill-opacity=".8"><title>' + esc(p.title) + '</title></circle>'; });
    (tm.gaps || []).forEach(function(gp, i){
      out += '<g><circle cx="' + X(gp.x) + '" cy="' + Y(gp.y) + '" r="9.5" fill="#f2c94c" stroke="#ba5757" stroke-width="1.6"/>' +
        '<text x="' + X(gp.x) + '" y="' + (Y(gp.y) + 3.2) + '" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5a3d00">G' + (i + 1) + '</text><title>' + esc(gp.label || 'Research gap') + '</title></g>'; });
    marks.forEach(function(m){ var p = by[key(m.title)]; if (!p) return;
      out += '<g class="mk" data-n="' + m.n + '"><circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="8.5" fill="#f2c94c" stroke="#9c6b00" stroke-width="1.3"/>' +
        '<text x="' + X(p.x) + '" y="' + (Y(p.y) + 3.4) + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5a3d00">' + m.n + '</text><title>' + esc(m.title) + '</title></g>'; });
    var me = by[key(ownTitle)];
    if (me) {
      var mx = X(me.x), my = Y(me.y), right = me.x < .7;
      out += '<circle cx="' + mx + '" cy="' + my + '" r="5.5" fill="#ba5757" stroke="#fff" stroke-width="1.3"/><circle cx="' + mx + '" cy="' + my + '" r="11" fill="none" stroke="#ba5757" stroke-width="2.2"/>' +
        '<g transform="translate(' + (right ? mx + 15 : mx - 95) + ' ' + (my - 22) + ')"><rect width="80" height="19" rx="9.5" fill="#ba5757"/><text x="40" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Your paper</text></g>';
    }
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Topic map with your paper and the suggested papers" style="font-family:system-ui,sans-serif">' + out + '</svg>';
    el.querySelectorAll('.mk').forEach(function(m){ m.addEventListener('click', function(){ location.hash = 'cand-' + m.dataset.n; }); });
  }

  function fail(msg){ rp.innerHTML = '<div class="state">' + msg + '</div>'; }
  if (!/^[A-Za-z0-9_-]{8,40}$/.test(id)) { fail('This report link is not complete. Please open the link from your email again.'); return; }
  (async function(){
    var h = {};
    try {
      if (window.SciCoAuth) {
        var u = await window.SciCoAuth.getUser();
        if (u) { signedIn = true; var nb = document.querySelector('.nav .js-signin'); if (nb) nb.textContent = 'Back to app'; }
        var tok = u ? await window.SciCoAuth.getToken() : null;
        if (tok) h.Authorization = 'Bearer ' + tok;
      }
    } catch(_) {}
    try {
      var base = ((window.SCICO_CONFIG || {}).API_BASE || '').replace(/\/$/, '');
      var res = await fetch(base + '/reports/' + encodeURIComponent(id), { headers: h });
      if (res.status === 410) { fail('This report has expired. <a href="search.html" class="js-open" style="text-decoration:underline">Run a fresh search with Eratost</a>.'); return; }
      if (!res.ok) { fail('We could not find this report. It may have been removed.'); return; }
      render(await res.json());
    } catch (e) { fail('The report could not load just now. Please try again in a minute.'); }
  })();

  document.querySelectorAll('.js-signin').forEach(function(b){ b.addEventListener('click', openApp); });
  var nav = document.querySelector('.nav');
  var onScroll = function(){ nav.classList.toggle('nav--scrolled', window.scrollY > 10); };
  onScroll(); window.addEventListener('scroll', onScroll, { passive: true });
  var toggle = document.getElementById('nav-toggle');
  toggle.addEventListener('click', function(){ var open = nav.classList.toggle('nav--open'); toggle.setAttribute('aria-expanded', String(open)); });
})();
</script>
