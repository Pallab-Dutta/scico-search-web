<style>
/* Same structure and type as Benjamin's pricing page; same palette as the Eratosthenes homepage. */
:root{
  --bg:#f7f4ee; --bg-alt:#eeeae1; --surface:#fffdf9; --border:#dcd5c7;
  --text:#1e2a31; --muted:#5e6a71; --slate:#6e7a82;
  --accent:#ba5757; --accent-dark:#9c4343;
  --red-soft:#f3dcd9; --slate-soft:#dfe5e8;
  --shadow:0 8px 24px -12px rgba(30,42,49,.28);
  --radius:16px;
  --font-serif:"Cutive Mono",monospace;
  --font-sans:"Cutive Mono",monospace;
  --font-prose:"Lora",Georgia,"Times New Roman",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);font-weight:700;background:var(--bg);color:var(--text);
     line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;
     font-family:var(--font-sans);font-weight:600;text-decoration:none;border-radius:999px;cursor:pointer;
     border:1px solid transparent;transition:transform .15s,box-shadow .15s,background-color .15s,color .15s;white-space:nowrap}
.btn--primary{background:var(--red-soft);color:var(--accent-dark)}
.btn--primary:hover{background:var(--slate-soft);color:var(--text);transform:translateY(-1px)}
.btn--ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn--ghost:hover{border-color:var(--text);transform:translateY(-1px)}
.btn--lg{padding:.85rem 1.7rem;font-size:1rem}
.btn--sm{padding:.5rem 1.1rem;font-size:.85rem}
.btn--block{width:100%}

/* ── Nav ─────────────────────────────────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:100;background:rgba(247,244,238,.72);
     backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
.nav--scrolled{border-bottom-color:var(--border);box-shadow:0 4px 20px -16px rgba(30,42,49,.45)}
.nav__inner{max-width:1100px;margin:0 auto;padding:1rem 1.5rem;
            display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
.nav__links{display:flex;align-items:center;gap:1.75rem;font-size:.95rem;font-weight:700}
.nav__links a{color:var(--accent-dark);transition:color .2s}
.nav__links a:hover,.nav__links a.active{color:var(--text)}
.nav__toggle{display:none;flex-direction:column;justify-content:center;gap:5px;
             width:36px;height:36px;background:transparent;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.nav__toggle span{display:block;height:2px;width:18px;margin:0 auto;background:var(--text);transition:transform .2s,opacity .2s}

/* ── Logo lockup: the mark and the name ("Eratost" in the logo's shadow) ─── */
.lockup{display:inline-flex;align-items:center;gap:.45em;font-family:"Cutive Mono",monospace;
        font-weight:700;line-height:1;white-space:nowrap}
.lockup .era-mark{width:1.75em;height:1.75em;flex:0 0 auto}
.lockup .era-a{color:#1e2a31}
.lockup .era-b{color:#d1d1d1}
.lockup--nav{font-size:1.55rem}
.lockup--footer{font-size:1.25rem}

/* ── Scroll-reveal ───────────────────────────────────────────────────────── */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease-out,transform .7s ease-out}
.reveal.in-view{opacity:1;transform:translateY(0)}

/* ── Shared section ──────────────────────────────────────────────────────── */
section{padding:5rem 1.5rem;max-width:1100px;margin:0 auto;scroll-margin-top:76px}
.section-title{font-family:var(--font-serif);font-size:clamp(1.7rem,4vw,2.4rem);text-align:center;margin-bottom:.75rem}
.section-sub{text-align:center;color:var(--muted);max-width:650px;margin:0 auto 3rem;font-size:1rem}

/* ── Pricing header ──────────────────────────────────────────────────────── */
.pricing-hero{padding:4.5rem 1.5rem 1rem;text-align:center}
.pricing-hero .section-sub{margin-bottom:1.5rem}
.billing-toggle{display:inline-flex;align-items:center;gap:.25rem;margin:.5rem auto 0;
                background:var(--bg-alt);border:1px solid var(--border);border-radius:999px;padding:.28rem}
.billing-toggle button{font-family:var(--font-sans);font-weight:700;font-size:.9rem;border:0;background:transparent;
                       color:var(--muted);cursor:pointer;border-radius:999px;padding:.5rem 1.2rem;transition:background .2s,color .2s}
.billing-toggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.billing-toggle .save-hint{font-size:.72rem;font-weight:700;color:var(--accent-dark);margin-left:.35rem}

/* ── Plan cards ──────────────────────────────────────────────────────────── */
.plans{padding-top:2rem;padding-bottom:1.5rem;max-width:1260px}
.plans__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.25rem;max-width:1200px;margin:0 auto}
.plan-card{position:relative;display:flex;flex-direction:column;gap:1.1rem;background:var(--surface);
           border:1px solid var(--border);border-radius:var(--radius);padding:2rem 1.75rem;transition:transform .2s,box-shadow .2s}
.plan-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.plan-card--pro{border-color:var(--accent);box-shadow:0 0 0 2px rgba(186,87,87,.14),var(--shadow)}
.plan-badge{position:absolute;top:-.8rem;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:700;
            letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:999px;
            padding:.28rem .85rem;white-space:nowrap}
.plan-name{font-family:var(--font-serif);font-size:1.25rem}
.plan-for{font-size:.85rem;color:var(--muted);margin-top:-.7rem}
.plan-price{display:flex;align-items:baseline;gap:.3rem;flex-wrap:wrap}
.plan-price .amount{font-family:var(--font-serif);font-size:2.6rem;line-height:1;color:var(--text)}
.plan-price .unit{font-size:.95rem;color:var(--muted);font-weight:700}
.plan-sub{font-size:.85rem;color:var(--muted);min-height:1.2em}
.plan-save{display:inline-block;font-size:.75rem;font-weight:700;color:var(--accent-dark);background:var(--red-soft);
           border-radius:999px;padding:.2rem .6rem;width:max-content}
.plan-save:empty{display:none}
.plan-feats{list-style:none;display:flex;flex-direction:column;gap:.6rem;font-size:.9rem;font-weight:400;
            font-family:var(--font-prose);color:var(--text)}
.plan-feats li{display:flex;align-items:flex-start;gap:.55rem}
.plan-feats .tick{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:1.25rem;height:1.25rem;
                  border-radius:50%;background:var(--slate-soft);color:var(--text);font-size:.72rem;margin-top:.12em}
.plan-feats li.soon{color:var(--muted)}
.plan-feats li.soon .tick{background:var(--bg-alt);color:var(--muted)}
.plan-feats b{font-weight:600}
.soon-pill{align-self:center;font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
           border:1px dashed var(--border);border-radius:999px;padding:.08rem .45rem;white-space:nowrap;font-family:var(--font-sans)}
.plan-card .btn{margin-top:auto}
.plan-fineprint{font-size:.75rem;color:var(--muted);text-align:center;max-width:760px;margin:1.5rem auto 0}
.plan-fineprint a{text-decoration:underline}

/* ── Labs & institutions ─────────────────────────────────────────────────── */
.enterprise{max-width:1040px;padding-top:1rem}
.enterprise__inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.5rem;
                   background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem 2.25rem}
.enterprise__text{flex:1 1 340px}
.enterprise__text h2{font-family:var(--font-serif);font-size:1.35rem;margin-bottom:.5rem}
.enterprise__text p{color:var(--muted);font-size:.95rem;font-weight:400;font-family:var(--font-prose)}

/* ── Features ────────────────────────────────────────────────────────────── */
.features__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem;margin-top:1rem}
.feature-card{position:relative;border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;
              background:var(--surface);transition:transform .2s,box-shadow .2s}
.feature-card--pro{border-color:var(--accent)}
.feature-card--soon{border-style:dashed}
.feat-badge{position:absolute;top:1.1rem;right:1.1rem;font-size:.6rem;font-weight:700;letter-spacing:.06em;
            text-transform:uppercase;color:#fff;background:var(--accent);border-radius:999px;padding:.16rem .5rem}
.feat-badge--soon{color:var(--muted);background:var(--bg-alt);border:1px dashed var(--border)}
.feature-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.feature-card h3{font-family:var(--font-serif);font-size:1.1rem;margin-bottom:.5rem}
.feature-card .feat-badge ~ h3{padding-right:3.5rem}
.feature-card p{color:var(--muted);font-size:.95rem;font-weight:400;font-family:var(--font-prose)}
@media(min-width:900px){.features__grid{grid-template-columns:repeat(4,1fr)}}

/* ── FAQ ─────────────────────────────────────────────────────────────────── */
.faq{max-width:760px}
.faq__item{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:1.1rem 1.35rem;margin-bottom:1rem}
.faq__item summary{cursor:pointer;font-weight:700;font-size:1rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.faq__item summary::-webkit-details-marker{display:none}
.faq__item summary::after{content:"+";color:var(--accent);font-size:1.3rem;transition:transform .2s}
.faq__item[open] summary::after{transform:rotate(45deg)}
.faq__item p{margin-top:.85rem;color:var(--muted);font-size:.95rem;font-weight:400;font-family:var(--font-prose)}
.faq__item a{color:var(--accent-dark);text-decoration:underline}

/* ── CTA ─────────────────────────────────────────────────────────────────── */
.cta__inner{text-align:center;background:var(--red-soft);transition:background .35s ease;border-radius:24px;padding:3.5rem 2rem;color:var(--text)}
.cta__inner h2{font-family:var(--font-serif);font-size:clamp(1.5rem,3.5vw,2.1rem);margin-bottom:.5rem}
.cta__inner p{opacity:.8;margin-bottom:1.75rem}
.cta__inner:hover{background:var(--slate-soft)}
.cta__inner .btn--primary{background:transparent;color:var(--accent-dark);border:2px solid var(--accent-dark)}
.cta__inner:hover .btn--primary{color:var(--text);border-color:var(--text)}

/* ── Footer ──────────────────────────────────────────────────────────────── */
.footer{border-top:1px solid var(--border);padding:2rem 1.5rem}
.footer__inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
.footer__copy{color:var(--muted);font-size:.9rem}
.footer__copy a:hover{color:var(--accent-dark)}

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media(max-width:760px){
  .nav__links{position:absolute;top:100%;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);
              flex-direction:column;align-items:stretch;gap:1rem;padding:1.25rem 1.5rem;display:none}
  .nav--open .nav__links{display:flex}
  .nav__links a{text-align:center}
  .nav__toggle{display:flex}
  .nav--open .nav__toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav--open .nav__toggle span:nth-child(2){opacity:0}
  .nav--open .nav__toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  section{padding:3.5rem 1rem}
  .pricing-hero{padding:3rem 1rem 1rem}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{transition:none!important;opacity:1!important;transform:none!important}
}
.us{max-width:560px;margin:5rem auto;padding:0 1.5rem;text-align:center}.us h1{font-family:var(--font-serif);font-size:1.7rem;margin-bottom:.8rem}.us p{font-family:var(--font-prose);font-weight:400;color:var(--muted);line-height:1.6;margin-bottom:1.2rem}
</style>

<script>
(function(){
  var L = window.EratostLoader;
  if (L) document.querySelectorAll('.js-mark').forEach(function(a){ a.insertAdjacentHTML('afterbegin', L.mark()); });
  var q = new URLSearchParams(location.search), e = q.get('e') || '', s = q.get('s') || '', box = document.getElementById('us');
  var esc = function(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  if (!e || !s) { box.innerHTML = '<h1>Unsubscribe</h1><p>This link is not complete. Write to <a href="mailto:contact@scicoagent.com" style="text-decoration:underline">contact@scicoagent.com</a> and we will remove you.</p>'; return; }
  box.innerHTML = '<h1>Stop emails from Eratost?</h1><p>We will not email <b>' + esc(e) + '</b> again.</p><button class="btn btn--primary btn--lg" id="go">Unsubscribe</button>';
  document.getElementById('go').addEventListener('click', async function(){
    this.disabled = true; this.textContent = 'One moment…';

      var base = ((window.SCICO_CONFIG || {}).API_BASE || '').replace(/\/$/, '');

    } catch (_) {
      box.innerHTML = '<h1>That did not work</h1><p>Please write to <a href="mailto:contact@scicoagent.com" style="text-decoration:underline">contact@scicoagent.com</a> and we will remove you by hand.</p>';
    }
  });
  var toggle = document.getElementById('nav-toggle'), nav = document.querySelector('.nav');

})();
</script>
